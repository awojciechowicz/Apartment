name: Scraper mieszkan Berlin

on:
  # Co godzinę
  schedule:
    - cron: "0 * * * *"
  # Dzienny raport zbiorczy o 19:30 CEST (17:30 UTC)
    - cron: "30 17 * * *"
  # Reczne uruchomienie z GitHub UI (Actions -> Run workflow)
  workflow_dispatch:
    inputs:
      min_rooms:
        description: "Minimalna liczba pokoi"
        required: false
        default: "4"
      daily_summary:
        description: "Wyslij dzienny raport zbiorczy (wszystkie nowe oferty z dzisiaj)"
        required: false
        default: "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Tylko jedno uruchomienie naraz - zapobiega rownoleglym scraingom
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # potrzebne do git push (commit DB)

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4
        with:
          # Pobierz pelna historie, zeby git push dzialal poprawnie
          fetch-depth: 1

      - name: Ustaw Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zainstaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Zainstaluj Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Uruchom scraper
        env:
          NOTIFY_SMTP_HOST: ${{ secrets.NOTIFY_SMTP_HOST }}
          NOTIFY_SMTP_PORT: ${{ secrets.NOTIFY_SMTP_PORT }}
          NOTIFY_SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER }}
          NOTIFY_SMTP_PASSWORD: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          MIN_ROOMS="${{ github.event.inputs.min_rooms || '5' }}"
          DAILY="${{ github.event.inputs.daily_summary || 'false' }}"
          # Dzienny raport: trigger 'cron 30 17' (19:30 CEST) lub reczny z flaga
          if [ "${{ github.event.schedule }}" = "30 17 * * *" ] || [ "$DAILY" = "true" ]; then
            echo "Tryb: dzienny raport zbiorczy"
            python main.py "$MIN_ROOMS" --daily-summary
          else
            echo "Tryb: normalny scrape"
            python main.py "$MIN_ROOMS"
          fi

      - name: Statystyki bazy
        if: always()
        run: python -c "import db; db.init_db(); db.print_stats()"

      # Commituj zaktualizowana baze danych z powrotem do repo
      - name: Zapisz DB do repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mieszkania.db
          git diff --staged --quiet || git commit -m "chore: update DB [skip ci]"
          git push
